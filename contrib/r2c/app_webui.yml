rules:
  - id: app-webui-no-components-bucket
    message: Use $lib/views or $lib/*/views instead of $lib/components.
    severity: ERROR
    languages:
      - regex
    paths:
      include:
        - /app/webui/src/**/*.svelte
        - /app/webui/src/**/*.ts
    pattern-regex: 'from\s+"\$lib/components"'

  - id: app-webui-non-icons-no-hyic-exports
    message: Only src/lib/icons may export HyIc symbols.
    severity: ERROR
    languages:
      - regex
    paths:
      include:
        - /app/webui/src/lib/**/*.svelte
        - /app/webui/src/lib/**/*.ts
      exclude:
        - /app/webui/src/lib/icons/**
    pattern-regex: 'export\s+\{\s*(?:default\s+as\s+)?HyIc[A-Za-z0-9_]*\s*\}|export\s+(?:const|function|class)\s+HyIc[A-Za-z0-9_]*'

  - id: app-webui-non-anim-no-hyan-exports
    message: Only src/lib/anim may export HyAn symbols.
    severity: ERROR
    languages:
      - regex
    paths:
      include:
        - /app/webui/src/lib/**/*.svelte
        - /app/webui/src/lib/**/*.ts
      exclude:
        - /app/webui/src/lib/anim/**
    pattern-regex: 'export\s+\{\s*(?:default\s+as\s+)?HyAn[A-Za-z0-9_]*\s*\}|export\s+(?:const|function|class)\s+HyAn[A-Za-z0-9_]*'

  - id: app-webui-non-hyutil-no-hyutil-exports
    message: Only src/lib/HyUtil.ts may export HyUtil symbols.
    severity: ERROR
    languages:
      - regex
    paths:
      include:
        - /app/webui/src/lib/**/*.ts
      exclude:
        - /app/webui/src/lib/HyUtil.ts
    pattern-regex: 'export\s+\{\s*(?:default\s+as\s+)?HyUtil[A-Za-z0-9_]*\s*\}|export\s+(?:const|function|class)\s+HyUtil[A-Za-z0-9_]*'

  - id: app-webui-non-txutil-no-hytxutil-exports
