  - id: app-webui-general-views-no-domain-view-imports
    message: app/webui src/lib/views must stay independent from domain view layers.
    severity: ERROR
    languages:
      - regex
    paths:
      include:
        - /app/webui/src/lib/views/**/*.svelte
        - /app/webui/src/lib/views/**/*.ts
    pattern-regex: 'from\s+"(?:\$lib/(?:tx|block|validator|address|balances)/views|[^"]*/(?:tx|block|validator|address|balances)/views)"|from\s+''(?:\$lib/(?:tx|block|validator|address|balances)/views|[^'']*/(?:tx|block|validator|address|balances)/views)'''

  - id: app-webui-general-views-no-special-family-exports
    message: app/webui src/lib/views must export only Hy symbols.
    severity: ERROR
    languages:
      - regex
    paths:
      include:
        - /app/webui/src/lib/views/**/*.ts
    pattern-regex: 'export\s+\{\s*(?:default\s+as\s+)?Hy(?:Tx|Bl|Vl|Ad|Ic|An)[A-Za-z0-9_]*\s*\}|export\s+(?:const|function|class)\s+Hy(?:Tx|Bl|Vl|Ad|Ic|An)[A-Za-z0-9_]*'

  - id: app-webui-tx-views-no-cross-family-imports
