    pattern-regex: 'from\s+"(?:\$lib/(?:block|validator|balances)/views|[^"]*/(?:block|validator|balances)/views)"|from\s+''(?:\$lib/(?:block|validator|balances)/views|[^'']*/(?:block|validator|balances)/views)'''

  - id: app-webui-views-no-family-prefix-drift
    message: app/webui src/lib/views exports must stay in the Hy family only.
    severity: ERROR
    languages:
      - regex
    paths:
      include:
        - /app/webui/src/lib/views/index.ts
    pattern-regex: 'export\s+\{\s*default\s+as\s+Hy(?:Tx|Bl|Vl|Ad|An|Ic)[A-Za-z0-9_]*\s*\}'

  - id: app-webui-icons-no-family-prefix-drift
