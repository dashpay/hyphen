    pattern-regex: 'export\s+\{\s*default\s+as\s+Hy(?!Ad)[A-Za-z0-9_]+\s*\}'

  - id: app-webui-responsive-width-literals
    message: Use shared webui breakpoint widths only.
    severity: ERROR
    languages:
      - regex
    paths:
      include:
        - /app/webui/src/**/*.svelte
        - /app/webui/src/**/*.css
    pattern-regex: '@(?:media|container)\s*\([^)]*width:\s*(?!360px|480px|768px|1023px|1024px|1440px|1920px)\d+px'

  - id: app-webui-no-hypagecolumns-mobilebreakpoint
    message: HyPageColumns uses stackAt instead of mobileBreakpoint.
    severity: ERROR
    languages:
      - regex
    paths:
      include:
        - /app/webui/src/**/*.svelte
        - /app/webui/src/**/*.ts
    pattern-regex: '<HyPageColumns[^>]*\bmobileBreakpoint\s*='

  - id: app-webui-no-hypagecolumns-columns-prop
    message: HyPageColumns uses mode instead of raw columns strings.
    severity: ERROR
    languages:
      - regex
    paths:
      include:
        - /app/webui/src/**/*.svelte
        - /app/webui/src/**/*.ts
    pattern-regex: '<HyPageColumns[^>]*\bcolumns\s*='

  - id: app-webui-no-table-layout-measurement
    message: Use shared HyTableUtil measurement helpers instead of local DOM probes.
    severity: ERROR
    languages:
      - regex
    paths:
      include:
        - /app/webui/src/**/*.svelte
        - /app/webui/src/**/*.ts
      exclude:
        - /app/webui/src/lib/views/HyTableUtil.ts
    pattern-regex: 'measureColumnWidth\s*\(|querySelectorAll<HTMLElement>\('

  - id: app-webui-no-table-max-content-columns
    message: Use bounded shared table widths instead of max-content columns.
    severity: ERROR
    languages:
      - regex
    paths:
      include:
        - /app/webui/src/lib/**/*.svelte
    pattern-regex: '(?:headerWidth|width):\s*"max-content"'
