        - /app/webui/src/lib/tx/views/**
    pattern-regex: 'export\s+\{\s*(?:default\s+as\s+)?HyTx[A-Za-z0-9_]*\s*\}|export\s+(?:const|function|class)\s+HyTx[A-Za-z0-9_]*'

  - id: app-webui-non-blutil-no-hyblutil-exports
