        - /app/webui/src/lib/block/HyBlUtil.ts
    pattern-regex: 'export\s+\{\s*(?:default\s+as\s+)?HyBl[A-Za-z0-9_]*\s*\}|export\s+(?:const|function|class)\s+HyBl[A-Za-z0-9_]*'

  - id: app-webui-views-barrel-hy-prefix
    message: app/webui src/lib/views exports must use the Hy prefix.
    severity: ERROR
    languages:
      - regex
    paths:
      include:
        - /app/webui/src/lib/views/index.ts
    pattern-regex: 'export\s+\{\s*default\s+as\s+(?!Hy)[A-Za-z0-9_]+\s*\}'

  - id: app-webui-no-dash-literals-outside-config
    message: Keep Dash, DASH, and Dash Core literals in src/lib/config only.
    severity: ERROR
    languages:
      - regex
    paths:
      include:
        - /app/webui/src/**/*.svelte
        - /app/webui/src/**/*.ts
      exclude:
        - /app/webui/src/lib/config/**
    pattern-regex: '["''](?:[^"'']*\b(?:Dash Core|DASH|Dash)\b[^"'']*)["'']'

