          - pattern-regex: '(?s)pub\s+async\s+fn\s+balances_page\b(?:(?!\npub\s+async\s+fn).)*\b(?:tx_outputs|tx_inputs|address_balances)\b'
          - pattern-regex: '(?s)pub\s+async\s+fn\s+balances_summary\b(?:(?!\npub\s+async\s+fn).)*\b(?:tx_outputs|tx_inputs|address_balances)\b'
  - id: daemon-rest-openapi-public-schemas-must-derive-debug
    message: Public REST OpenAPI schema structs must derive Debug per the Rust guide.
