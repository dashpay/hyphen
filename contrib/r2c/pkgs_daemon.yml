        - /pkgs/daemon/src/rest/openapi.rs
    patterns:
      - pattern-regex: '#\[derive\((?![^\]]*\bDebug\b)[^\]]*\bToSchema\b[^\]]*\)\]'
  - id: daemon-config-toml-parsing-must-stay-in-init-config
    message: Raw TOML config parsing belongs only in init/config.rs.
