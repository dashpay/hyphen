      include:
        - /pkgs/daemon/src/**/*.rs
      exclude:
        - /pkgs/daemon/src/init/config.rs
    patterns:
      - pattern-not-inside: |
          mod tests {
            ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $M {
            ...
          }
      - pattern-either:
          - pattern: toml::from_str(...)
          - pattern: toml::from_slice(...)
          - pattern-regex: 'toml::de::from_[A-Za-z_]+\s*\('
  - id: daemon-args-parsing-must-stay-in-init-args
