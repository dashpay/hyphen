# Production reverse proxy configuration with TLS termination.
#
# Inherits all proxy rules, rate limiting, security headers, and bot
# protection from the shared includes. Adds TLS and HSTS via SWAG's
# ssl.conf, and an HTTP-to-HTTPS redirect.
#
# The public domain is sourced from HYPHEN_DOMAIN in .env and propagated
# through the SWAG URL environment variable in docker-compose.yml.

include /etc/nginx/hyphen/include/http.conf;

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name _;

    include /config/nginx/ssl.conf;

    include /etc/nginx/hyphen/include/server.conf;
}

# Redirect all plaintext traffic to HTTPS.
server {
    listen 80;
    listen [::]:80;

    server_name _;

    return 301 https://$host$request_uri;
}
