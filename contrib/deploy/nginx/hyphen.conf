# Base reverse proxy configuration for the Hyphen block explorer.
#
# Routes:
#   /        proxied to the webui container (static frontend)
#   /api/    proxied to hyphend (REST API, port 3080)
#
# This configuration serves plaintext HTTP and is used directly for
# local development. The production variant (tls.conf) includes the
# same shared rules and adds TLS termination.

include /etc/nginx/hyphen/include/http.conf;

server {
    listen 80;
    listen [::]:80;

    server_name _;

    set $cors_origin "http://$host";

    include /etc/nginx/hyphen/include/server.conf;
}
