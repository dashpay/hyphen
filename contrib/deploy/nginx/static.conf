# Static frontend, served inside the webui container.
#
# The UI is a single-page app: unknown paths fall back to 200.html so that
# deep links resolve client-side. /webui.conf is the UI's runtime
# configuration, mounted from webui/<network>.conf.

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;

    location = /webui.conf {
        alias /etc/hyphen/webui.conf;
    }

    location / {
        try_files $uri $uri/ /200.html;
    }
}
