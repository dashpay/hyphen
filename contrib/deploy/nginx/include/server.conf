# Shared server-level directives and location blocks.
# Included inside a server{} block by both hyphen.conf and tls.conf.

access_log /var/log/nginx/access.log json-logger;
error_log  /var/log/nginx/error.log;

# Connection limits.
server_tokens off;
client_max_body_size  1k;
client_body_timeout   10s;
client_header_timeout 10s;
keepalive_timeout     30s 30s;

# Security headers.
add_header X-Content-Type-Options        "nosniff"                          always;
add_header X-Frame-Options               "DENY"                             always;
add_header X-DNS-Prefetch-Control        "off"                              always;
add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
add_header Cross-Origin-Resource-Policy  "same-site"                        always;
add_header Cross-Origin-Embedder-Policy  "require-corp"                     always;
add_header Cross-Origin-Opener-Policy    "same-origin"                      always;
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    always;

# Compression.
gzip on;
gzip_types text/plain text/css application/json application/javascript
           text/xml application/xml application/xml+rss text/javascript;

if ($blocked_agent) {
    return 444;
}

# The explorer is read-only; reject anything other than safe methods.
if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
    return 405;
}

# API reverse proxy.
location /api/ {
    limit_req zone=api burst=40 nodelay;

    proxy_pass         http://hyphend:3080/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_hide_header  Server;
    proxy_hide_header  X-Powered-By;

    # Required for SSE streaming; disables response buffering so events
    # reach the client without delay.
    proxy_set_header   Connection        '';
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin  $cors_origin;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        add_header Access-Control-Max-Age        86400;
        add_header Content-Length                 0;
        return 204;
    }
}

# Static frontend.
location / {
    limit_req zone=pages burst=20 nodelay;

    proxy_pass         http://webui:80;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_hide_header  Server;
    proxy_hide_header  X-Powered-By;
}

# Drop connections to paths commonly probed by scanners.
location ~ /\.(env|git|svn|htaccess|htpasswd|php|asp|jsp|bak|sql)$ {
    return 444;
}

location ~ /\. {
    return 444;
}
