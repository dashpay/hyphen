# Shared server-level directives and location blocks.
# Included inside a server{} block by both hyphen.conf and tls.conf.

access_log /var/log/nginx/access.log json-logger;
error_log  /var/log/nginx/error.log;

# Connection limits.
server_tokens off;
client_max_body_size  1k;
client_body_timeout   10s;
client_header_timeout 10s;
keepalive_timeout     30s 30s;

# Security headers.
add_header X-Content-Type-Options        "nosniff"                          always;
add_header X-Frame-Options               "DENY"                             always;
add_header X-DNS-Prefetch-Control        "off"                              always;
add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
add_header Cross-Origin-Resource-Policy  "same-site"                        always;
add_header Cross-Origin-Embedder-Policy  "unsafe-none"                      always;
add_header Cross-Origin-Opener-Policy    "same-origin"                      always;
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; img-src 'self' data:; font-src 'self' fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    always;

# Compression.
gzip on;
gzip_types text/plain text/css application/json application/javascript
           text/xml application/xml application/xml+rss text/javascript;

if ($blocked_agent) {
    return 444;
}

# The explorer is read-only; reject anything other than safe methods.
if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
    return 405;
}

# Resolve the backends per request through Docker's DNS, so that nginx
# follows them when a rebuild gives a container a new address.
resolver 127.0.0.11 valid=10s ipv6=off;
set $hyphend_backend http://hyphend:3080;
set $webui_backend   http://webui:80;

# API reverse proxy.
location /api/ {
    limit_req zone=api burst=40 nodelay;

    proxy_pass         $hyphend_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_hide_header  Server;
    proxy_hide_header  X-Powered-By;

    # Required for SSE streaming; disables response buffering so events
    # reach the client without delay.
    proxy_set_header   Connection        '';
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;

    # hyphend sets the CORS headers itself; adding them here as well would
    # send each one twice, which browsers reject.
}

# Static frontend.
location / {
    limit_req zone=pages burst=60 nodelay;

    proxy_pass         $webui_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_hide_header  Server;
    proxy_hide_header  X-Powered-By;
}

# Drop connections to paths commonly probed by scanners.
location ~ /\.(env|git|svn|htaccess|htpasswd|php|asp|jsp|bak|sql)$ {
    return 444;
}

location ~ /\. {
    return 444;
}
