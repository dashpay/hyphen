# Shared http-level directives.
# Included at the http context by both hyphen.conf and tls.conf.

# Per-IP rate limiting: 20 req/s for the API, 30 req/s for pages.
limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=pages:10m rate=30r/s;
limit_req_status 429;

# Drop connections from known scanner user agents without responding.
map $http_user_agent $blocked_agent {
    default          0;
    ~*wpscan         1;
    ~*dirbuster      1;
    ~*gobuster       1;
    ~*nikto          1;
    ~*sqlmap         1;
    ~*nmap           1;
    ~*masscan        1;
    ~*zgrab          1;
}

# Structured JSON access log for aggregation into monitoring or SIEM systems.
log_format json-logger escape=json '{'
    '"type":"access-log",'
    '"time":"$time_iso8601",'
    '"remote_ip":"$remote_addr",'
    '"x_forwarded_for":"$proxy_add_x_forwarded_for",'
    '"request_id":"$request_id",'
    '"status":$status,'
    '"method":"$request_method",'
    '"host":"$host",'
    '"path":"$uri",'
    '"query":"$args",'
    '"protocol":"$server_protocol",'
    '"request_length":$request_length,'
    '"response_bytes":$body_bytes_sent,'
    '"duration":$request_time,'
    '"upstream_duration":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
    '}';
