# Local development override.
#
# Replaces SWAG with plain nginx using the base hyphen.conf (no TLS).
# The proxy rules, rate limiting, security headers, and bot protection
# are identical to production since both configs include the same
# shared snippets.
#
# Docker Compose merges this file automatically when it sits alongside
# docker-compose.yml. To use: cp .env.local .env
#
# The explorer is available at http://localhost with the API at
# http://localhost/api/ and directly at http://localhost:3080.

services:
  hyphend:
    ports:
      - "3080:3080"

  nginx:
    image: nginx:1-alpine
    cap_drop:
      - ALL
    environment: []
    volumes:
      - ./nginx/:/etc/nginx/hyphen/:ro
      - ./nginx/hyphen.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
