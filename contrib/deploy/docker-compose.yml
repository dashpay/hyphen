services:
  dashd:
    image: dashpay/dashd:23
    restart: unless-stopped
    volumes:
      - dash-data:/dash
      - ./dash.conf:/dash/.dashcore/dash.conf:ro
    networks:
      - net-dash

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: hyphen
      POSTGRES_USER: hyphen
      POSTGRES_PASSWORD: hyphen
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - net-db

  hyphend:
    build:
      context: ../..
      dockerfile: contrib/deploy/Dockerfile.hyphend
    restart: unless-stopped
    depends_on:
      - dashd
      - postgres
    volumes:
      - hyphen-data:/data
      - ./hyphen.conf:/data/hyphen.conf:ro
    networks:
      - net-dash
      - net-db
      - net-api

  webui:
    build:
      context: ../..
      dockerfile: contrib/deploy/Dockerfile.webui
    restart: unless-stopped
    depends_on:
      - hyphend
    networks:
      - net-web

  nginx:
    image: linuxserver/swag:latest
    restart: unless-stopped
    depends_on:
      - hyphend
      - webui
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - URL=${HYPHEN_DOMAIN}
      - VALIDATION=http
      - EMAIL=${HYPHEN_EMAIL}
    volumes:
      - swag-config:/config
      - ./nginx/:/etc/nginx/hyphen/:ro
      - ./nginx/tls.conf:/config/nginx/site-confs/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - net-api
      - net-web

networks:
  net-dash:
    internal: true
  net-db:
    internal: true
  net-api:
    internal: true
  net-web:
    internal: true

volumes:
  dash-data:
  pg-data:
  hyphen-data:
  swag-config:
