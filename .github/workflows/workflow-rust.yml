name: Rust

on:
  workflow_run:
    workflows: ["Run linters"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  gate:
    name: Check lint result
    runs-on: ubuntu-24.04-arm
    if: >-
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Record tested commit
        run: echo "${{ github.event.workflow_run.head_sha }}" > tested-sha

      - name: Upload tested commit
        uses: actions/upload-artifact@v4
        with:
          name: tested-sha
          path: tested-sha
          overwrite: true

      - name: Resolve container image
        id: vars
        run: |
          HASH=$(echo -n "${{ hashFiles('contrib/docker/ci.Dockerfile', 'pyproject.toml', '.python-version') }}" | cut -c1-12)
          IMAGE="ghcr.io/${{ github.repository }}/hyphen-ci:${HASH}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

  build:
    name: Build workspace
    needs: gate
    uses: ./.github/workflows/build-rust.yml
    permissions:
      contents: read
      packages: read
    with:
      path: ${{ needs.gate.outputs.image }}
