name: Run linters

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  packages: read

jobs:
  container:
    name: Build container
    uses: ./.github/workflows/build-container.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      context: .
      file: contrib/docker/ci.Dockerfile
      name: hyphen-ci

  lint:
    name: Run linters
    needs: container
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    container:
      image: ${{ needs.container.outputs.path }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initial setup
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Run linters
        run: python3 contrib/lint/all_lint.py
