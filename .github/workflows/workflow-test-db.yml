name: Test hyphen-db

on:
  workflow_run:
    workflows: ["Rust"]
    types: [completed]
    branches-ignore: []

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  gate:
    name: Check build result
    runs-on: ubuntu-24.04-arm
    if: >-
      github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: read
    outputs:
      image: ${{ steps.vars.outputs.image }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Download tested commit
        uses: actions/download-artifact@v4
        with:
          name: tested-sha
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read tested commit
        id: sha
        run: |
          grep -Eqx '[0-9a-f]{40}' tested-sha
          echo "sha=$(cat tested-sha)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Resolve container image
        id: vars
        run: |
          HASH=$(echo -n "${{ hashFiles('contrib/docker/ci.Dockerfile', 'pyproject.toml') }}" | cut -c1-12)
          IMAGE="ghcr.io/${{ github.repository }}/hyphen-ci:${HASH}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

  test:
    name: Test hyphen-db
    needs: gate
    uses: ./.github/workflows/test-rust.yml
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      crate: hyphen-db
      path: ${{ needs.gate.outputs.image }}
      ref: ${{ needs.gate.outputs.sha }}
      postgres: true
