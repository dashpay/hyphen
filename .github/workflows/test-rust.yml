name: Test Rust

on:
  workflow_call:
    inputs:
      crate:
        description: "Name of crate to test"
        required: true
        type: string
      path:
        description: "Path to container"
        required: true
        type: string
      ref:
        description: "Commit to test"
        required: true
        type: string
      postgres:
        description: "Start a PostgreSQL 18 service for the tests"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test ${{ inputs.crate }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    container:
      image: ${{ inputs.path }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Shares the server's socket directory, so tests can connect over it.
      volumes:
        - pg_socket:/var/run/postgresql

    services:
      postgres:
        # An empty image skips the service.
        image: ${{ inputs.postgres && 'postgres:18' || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        volumes:
          - pg_socket:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Initial setup
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
          key: cargo-deps-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-${{ runner.arch }}-

      - name: Restore build cache
        uses: actions/cache/restore@v5
        with:
          path: target
          key: cargo-build-${{ runner.arch }}-${{ github.sha }}
          restore-keys: cargo-build-${{ runner.arch }}-

      - name: Test crate with coverage
        run: cargo llvm-cov --package ${{ inputs.crate }} --lcov --output-path lcov.info
        env:
          HYPHEN_TEST_DATABASE_URL: ${{ inputs.postgres && 'postgresql://postgres@postgres:5432/postgres' || '' }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: ${{ inputs.crate }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
