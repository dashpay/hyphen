name: Test Rust

on:
  workflow_call:
    inputs:
      crate:
        description: "Name of crate to test"
        required: true
        type: string
      path:
        description: "Path to container"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test ${{ inputs.crate }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    container:
      image: ${{ inputs.path }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Initial setup
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
          key: cargo-deps-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-${{ runner.arch }}-

      - name: Restore build cache
        uses: actions/cache/restore@v5
        with:
          path: target
          key: cargo-build-${{ runner.arch }}-${{ github.sha }}
          restore-keys: cargo-build-${{ runner.arch }}-

      - name: Test crate with coverage
        run: cargo llvm-cov --package ${{ inputs.crate }} --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: ${{ inputs.crate }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
