[package]
name = "dash-primitives"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Parse-only block and transaction primitives for Dash"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
path = "lib/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dash-parse"
path = "bin/main.rs"
required-features = ["bin"]

[features]
default = ["std"]
std = ["alloc", "dep:rs-x11-hash"]
alloc = []
serde = ["alloc", "dep:serde"]
bin = ["std", "serde", "dep:serde_json"]
wasm = ["alloc", "serde", "dep:serde_json", "dep:wasm-bindgen"]

[dependencies]
bs58 = { version = "0.5", default-features = false, features = ["alloc", "check"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
ripemd = { version = "0.1", default-features = false }
rs-x11-hash = { version = "0.1.8", optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", default-features = false }
wasm-bindgen = { version = "0.2", optional = true }

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[lints.rust]
keyword_idents = "deny"
missing_debug_implementations = "warn"
non_ascii_idents = "deny"
rust_2021_incompatible_closure_captures = "deny"
rust_2021_incompatible_or_patterns = "deny"
unsafe_code = "deny"
unused_must_use = "warn"
