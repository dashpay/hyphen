[package]
name = "hyphen-db"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "hyphen_db"
path = "src/lib.rs"
bench = false

[features]
default = []
# Exposes the mock scaffolding (`HyphenDb::from_parts`) and test fixtures so
# downstream crates (the daemon) can assemble a `HyphenDb` from their own fakes.
tests = []

[dev-dependencies]
# Integration tests seed a temp database directly and drive the public API.
bytes  = "1"
rstest = "0.23"
sqlx   = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "json", "migrate"] }
tokio  = { version = "1", features = ["rt-multi-thread", "macros"] }

[dependencies]
async-trait  = "0.1"
bytes        = "1"
hex          = "0.4"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
sqlx         = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "json", "migrate"] }
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing      = "0.1"

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[lints.rust]
keyword_idents = "deny"
missing_debug_implementations = "warn"
non_ascii_idents = "deny"
unsafe_code = "deny"
unused_must_use = "warn"
