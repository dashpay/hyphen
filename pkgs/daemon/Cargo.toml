[package]
name = "hyphend"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "hyphend"
path = "src/lib.rs"
bench = false

[[bin]]
name = "hyphend"
path = "src/main.rs"
required-features = ["daemon"]
bench = false

[features]
default = ["daemon"]
daemon = [
  "wire",
  "dep:async-trait",
  "dep:axum",
  "dep:bitcoin-consensus-encoding",
  "dep:bitcoin-units",
  "dep:bytes",
  "dep:clap",
  "dep:dash-num",
  "dep:dash-primitives",
  "dep:dash-script",
  "dep:dash-types",
  "dep:futures",
  "dep:fs2",
  "dep:hex",
  "dep:lru",
  "dep:rlimit",
  "dep:num-bigint",
  "dep:reqwest",
  "dep:hyphen-db",
  "dep:tokio",
  "dep:tokio-stream",
  "dep:time",
  "dep:toml",
  "dep:tower-http",
  "dep:tracing",
  "dep:tracing-appender",
  "dep:tracing-subscriber",
  "dep:url",
  "dep:utoipa",
  "dep:utoipa-swagger-ui",
  "dep:zeromq",
]
tests = ["daemon", "hyphen-db/tests"]
wire = []

[dependencies]
async-trait        = { version = "0.1", optional = true }
axum               = { version = "0.8", optional = true }
bytes              = { version = "1", optional = true }
clap               = { version = "4", features = ["derive"], optional = true }
bitcoin-consensus-encoding = { version = "1.3", default-features = false, features = ["alloc"], optional = true }
bitcoin-units      = { version = "0.7", default-features = false, features = ["alloc"], optional = true }
dash-num           = { git = "https://github.com/dashpay/base-sdk", rev = "a1d09d4d729ccc977dd5e06ab7004bee533f9014", optional = true }
dash-primitives    = { git = "https://github.com/dashpay/base-sdk", rev = "a1d09d4d729ccc977dd5e06ab7004bee533f9014", features = ["std", "portable"], optional = true } # portable keeps x86_64 builds free of ADX instructions
dash-script        = { git = "https://github.com/dashpay/base-sdk", rev = "a1d09d4d729ccc977dd5e06ab7004bee533f9014", optional = true }
dash-types         = { git = "https://github.com/dashpay/base-sdk", rev = "a1d09d4d729ccc977dd5e06ab7004bee533f9014", optional = true }
directories        = "6"
num-bigint         = { version = "0.4", optional = true }
futures            = { version = "0.3", optional = true }
fs2                = { version = "0.4", optional = true }
hex                = { version = "0.4", optional = true }
lru                = { version = "0.12", optional = true }
rlimit             = { version = "0.11", optional = true }
reqwest            = { version = "0.12", default-features = false, features = ["json"], optional = true }
hyphen-db          = { path = "../db", optional = true }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "test-util"], optional = true }
tokio-stream       = { version = "0.1", features = ["sync"], optional = true }
time               = { version = "0.3", features = ["formatting"], optional = true }
toml               = { version = "0.8", optional = true }
tower-http         = { version = "0.6", default-features = false, features = ["cors", "compression-gzip"], optional = true }
utoipa             = { version = "5", features = ["axum_extras"], optional = true }
utoipa-swagger-ui  = { version = "9", features = ["axum"], optional = true }
tracing            = { version = "0.1", optional = true }
tracing-appender   = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
url                = { version = "2", optional = true }
zeromq             = { version = "0.5", default-features = false, features = ["tokio-runtime", "tcp-transport"], optional = true }

[dev-dependencies]
# Enables the storage facade's `from_parts` seam so tests can inject in-memory
# fakes without a live Postgres.
hyphen-db = { path = "../db", features = ["tests"] }

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[lints.rust]
keyword_idents = "deny"
missing_debug_implementations = "warn"
non_ascii_idents = "deny"
rust_2021_incompatible_closure_captures = "deny"
rust_2021_incompatible_or_patterns = "deny"
unsafe_code = "deny"
unused_must_use = "warn"
