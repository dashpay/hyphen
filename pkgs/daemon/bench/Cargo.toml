[package]
name = "hyphend-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "bench_hyphen"
path = "src/main.rs"
bench = false

[dependencies]
async-trait = "0.1"
divan = "0.1"
hex = "0.4"
hyphend = { path = "..", default-features = false, features = ["bench"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "json"] }
tokio = { version = "1", features = ["sync"] }

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[lints.rust]
keyword_idents = "deny"
missing_debug_implementations = "warn"
non_ascii_idents = "deny"
rust_2021_incompatible_closure_captures = "deny"
rust_2021_incompatible_or_patterns = "deny"
unsafe_code = "deny"
unused_must_use = "warn"
